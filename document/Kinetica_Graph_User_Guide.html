<script>
(async function() {
  // Markdown is inlined below in <script type="text/markdown" id="md-source">
  const md = document.getElementById('md-source').textContent;

  // Configure marked. The `highlight` option was removed in marked v5, so
  // we run highlight.js *after* parsing instead — marked emits
  // <pre><code class="language-sql">…</code></pre> for ```sql fences,
  // and hljs.highlightElement picks those up.
  marked.setOptions({ gfm: true, breaks: false });

  // Render markdown
  const html = marked.parse(md);
  document.getElementById('content').innerHTML = html;

  // Apply syntax highlighting to every code block.
  document.querySelectorAll('.markdown-body pre code').forEach(block => {
    // marked emits "language-xxx"; hljs needs the class to start with "language-".
    // For unfenced blocks (no language tag) fall back to auto-detect.
    if (![...block.classList].some(c => c.startsWith('language-'))) {
      const result = hljs.highlightAuto(block.textContent);
      block.innerHTML = result.value;
      block.classList.add('hljs');
    } else {
      hljs.highlightElement(block);
    }
  });

  // Fix centered paragraphs (marked wraps <p align="center"> content)
  document.querySelectorAll('.markdown-body p').forEach(p => {
    const img = p.querySelector('img');
    if (img && p.innerHTML.includes('align="center"')) {
      p.style.textAlign = 'center';
    }
  });

  // Handle raw <p align="center"> that marked might pass through
  document.querySelectorAll('.markdown-body [align="center"]').forEach(el => {
    el.style.textAlign = 'center';
  });

  // GitHub-style slug: lower-case, strip punctuation, spaces → "-".
  // Matches the anchors used by the in-content Table of Contents (e.g. "## 1. Overview" → "1-overview").
  function slugify(text) {
    // GitHub slugger: strip non-word/space/hyphen, then convert spaces to hyphens.
    // Do NOT collapse consecutive hyphens — "A — B" must become "a--b" (match
    // GitHub's behavior) so in-content TOC anchors like `#7-graph_table--sql...` resolve.
    return text.toLowerCase()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s/g, '-')
      .replace(/^-|-$/g, '');
  }

  // Assign stable slug ids to ALL headings so in-content anchor links work.
  // marked doesn't add heading ids by default in recent versions.
  const allHeadings = document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4');
  const seen = {};
  allHeadings.forEach(h => {
    if (h.id) return;
    let slug = slugify(h.textContent) || 'heading';
    if (seen[slug] !== undefined) { seen[slug]++; slug = slug + '-' + seen[slug]; }
    else { seen[slug] = 0; }
    h.id = slug;
  });

  // Sidebar TOC: each h2 is a collapsible group. Walk siblings until the next
  // h2, collecting h3 and h4 subsections into a nested <ul> that expands on
  // caret click. Overview is expanded by default so first-time readers see the
  // structure; other groups expand on demand or when scroll-spy enters them.
  const headings = document.querySelectorAll('.markdown-body h2');
  const tocList = document.getElementById('tocList');
  const groupByHeadingId = {}; // h2 id -> group <li>
  function makeTocLink(heading, extraClass) {
    const a = document.createElement('a');
    a.href = '#' + heading.id;
    a.textContent = heading.textContent;
    a.dataset.id = heading.id;
    if (extraClass) a.classList.add(extraClass);
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const target = document.getElementById(heading.id);
      if (target) {
        history.pushState(null, '', '#' + heading.id);
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (window.innerWidth <= 1024) document.getElementById('sidebar').classList.remove('open');
    });
    return a;
  }
  headings.forEach(h => {
    const li = document.createElement('li');
    li.className = 'toc-group';
    const row = document.createElement('div');
    row.className = 'toc-row';
    const caret = document.createElement('button');
    caret.className = 'toc-caret';
    caret.type = 'button';
    caret.setAttribute('aria-label', 'Toggle subsections');
    caret.textContent = '▸'; // ▸
    row.appendChild(caret);
    row.appendChild(makeTocLink(h));
    li.appendChild(row);

    const sub = document.createElement('ul');
    sub.className = 'toc-sub';
    let sib = h.nextElementSibling;
    while (sib && sib.tagName !== 'H2') {
      if (sib.tagName === 'H3' || sib.tagName === 'H4') {
        const subLi = document.createElement('li');
        subLi.appendChild(makeTocLink(sib, sib.tagName === 'H3' ? 'h3-link' : 'h4-link'));
        sub.appendChild(subLi);
      }
      sib = sib.nextElementSibling;
    }
    if (sub.children.length > 0) {
      li.appendChild(sub);
      caret.addEventListener('click', (e) => {
        e.stopPropagation();
        const exp = li.classList.toggle('expanded');
        caret.classList.toggle('expanded', exp);
      });
    } else {
      caret.classList.add('empty');
    }

    // Default: Overview group expanded.
    if (/^\s*1\.\s*Overview/i.test(h.textContent)) {
      li.classList.add('expanded');
      caret.classList.add('expanded');
    }

    tocList.appendChild(li);
    groupByHeadingId[h.id] = li;
  });

  // Click-to-zoom lightbox: every image in the rendered markdown is clickable.
  // Clicking opens the lightbox in fit-to-viewport mode; the 1:1 button
  // switches to actual-pixel mode (with the overlay scrolling to pan large
  // images like the 5538-px-wide banking ontology).
  document.querySelectorAll('.markdown-body img').forEach(img => {
    img.addEventListener('click', (e) => {
      e.preventDefault();
      openLightbox(img);
    });
  });

  // In-content anchor links (e.g. the Table of Contents in the markdown itself).
  // Intercept so they use smooth scroll + respect the fixed header offset via
  // the scroll-margin-top CSS on headings.
  document.querySelectorAll('.markdown-body a[href^="#"]').forEach(a => {
    a.addEventListener('click', (e) => {
      const id = decodeURIComponent(a.getAttribute('href').slice(1));
      const target = document.getElementById(id);
      if (target) {
        e.preventDefault();
        history.pushState(null, '', '#' + id);
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  // Honor ?#anchor on initial load (after render + slug assignment).
  if (location.hash) {
    const t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (t) setTimeout(() => t.scrollIntoView({ block: 'start' }), 50);
  }

  // Scroll spy
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        updateScrollSpy();
        updateProgressBar();
        updateBackToTop();
        ticking = false;
      });
      ticking = true;
    }
  });

  function updateScrollSpy() {
    const scrollY = window.scrollY + 100;
    // Track the most recently scrolled-past h2, h3, h4 — the deepest one
    // becomes "current" so the matching sidebar entry is highlighted.
    let currentH2 = '';
    let currentSub = '';
    document.querySelectorAll('.markdown-body h2, .markdown-body h3, .markdown-body h4').forEach(h => {
      if (h.offsetTop <= scrollY) {
        if (h.tagName === 'H2') { currentH2 = h.id; currentSub = ''; }
        else { currentSub = h.id; }
      }
    });
    const current = currentSub || currentH2;
    document.querySelectorAll('.sidebar a').forEach(a => {
      a.classList.toggle('active', a.dataset.id === current);
      if (a.dataset.id === current) {
        a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
    // Auto-expand the group containing the active section.
    if (currentH2 && groupByHeadingId[currentH2]) {
      const grp = groupByHeadingId[currentH2];
      if (!grp.classList.contains('expanded')) {
        grp.classList.add('expanded');
        const c = grp.querySelector('.toc-caret');
        if (c) c.classList.add('expanded');
      }
    }
  }

  function updateProgressBar() {
    const winH = document.documentElement.scrollHeight - window.innerHeight;
    const pct = winH > 0 ? (window.scrollY / winH) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function updateBackToTop() {
    document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 400);
  }

  // Initial call
  updateScrollSpy();
  updateProgressBar();
})();

// TOC filter — filters all entries (h2 + h3 + h4) and auto-expands any
// group whose top-level link or any subsection link matches.
function filterToc() {
  const q = document.getElementById('tocSearch').value.toLowerCase();
  document.querySelectorAll('#tocList > li.toc-group').forEach(group => {
    const topA = group.querySelector(':scope > .toc-row a');
    const subItems = group.querySelectorAll(':scope > .toc-sub > li');
    const topMatch = !q || (topA && topA.textContent.toLowerCase().includes(q));
    let anyMatch = topMatch;
    subItems.forEach(li => {
      const a = li.querySelector('a');
      const m = !q || (a && a.textContent.toLowerCase().includes(q));
      li.style.display = m ? '' : 'none';
      if (m && q) anyMatch = true;
    });
    group.style.display = anyMatch ? '' : 'none';
    // While searching, auto-expand groups that have a sub-match (or always
    // when q is empty, restore the prior collapsed/expanded state — for
    // simplicity we just leave whatever state the user had).
    if (q && anyMatch && subItems.length > 0) {
      group.classList.add('expanded');
      const c = group.querySelector(':scope > .toc-row > .toc-caret');
      if (c) c.classList.add('expanded');
    }
  });
}

// Sidebar toggle (mobile)
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Lightbox controls — open/close + fit-vs-actual toggle.
function openLightbox(img) {
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightboxImg');
  const cap = document.getElementById('lightboxCaption');
  const toggleBtn = document.getElementById('lbToggle');
  lbImg.src = img.currentSrc || img.src;
  lbImg.alt = img.alt || '';
  // Caption: prefer the alt, fallback to nearest <em> sibling for figure-style markup.
  let caption = img.alt || '';
  const next = img.parentElement && img.parentElement.nextElementSibling;
  if (!caption && next) {
    const em = next.querySelector && next.querySelector('em');
    if (em) caption = em.textContent;
  }
  cap.textContent = caption;
  cap.style.display = caption ? '' : 'none';
  lb.classList.remove('actual');
  lb.classList.add('fit', 'open');
  toggleBtn.textContent = '1:1';
  document.body.style.overflow = 'hidden';
  lb.scrollTop = 0;
  lb.scrollLeft = 0;
}
function closeLightbox(e) {
  if (e && e.target && e.target.id !== 'lightbox' && !e.target.classList.contains('lightbox-stage')) return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function toggleLightboxZoom() {
  const lb = document.getElementById('lightbox');
  const btn = document.getElementById('lbToggle');
  const isActual = lb.classList.toggle('actual');
  lb.classList.toggle('fit', !isActual);
  btn.textContent = isActual ? 'Fit' : '1:1';
  // Center the scroll view when switching to actual size.
  if (isActual) {
    const img = document.getElementById('lightboxImg');
    requestAnimationFrame(() => {
      lb.scrollLeft = Math.max(0, (img.naturalWidth - lb.clientWidth) / 2);
      lb.scrollTop  = Math.max(0, (img.naturalHeight - lb.clientHeight) / 2);
    });
  }
}
// Esc to close.
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const lb = document.getElementById('lightbox');
    if (lb.classList.contains('open')) {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }
  }
});

// Theme toggle — flips [data-theme] on <html>. Persists choice in localStorage.
// Initial theme respects saved preference, else the OS setting.
function resolvedTheme() {
  const root = document.documentElement;
  const explicit = root.getAttribute('data-theme');
  if (explicit) return explicit;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyHljsTheme(theme) {
  const hlLink = document.querySelector('link[href*="highlightjs"][href*="styles"]');
  if (!hlLink) return;
  const target = theme === 'dark' ? 'github-dark.min.css' : 'github.min.css';
  hlLink.href = hlLink.href.replace(/github(-dark)?\.min\.css/, target);
}
function toggleTheme() {
  const next = resolvedTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('userGuideTheme', next); } catch (_) {}
  applyHljsTheme(next);
}
// Initialize theme before first paint of content.
// Default is dark; user's last toggle (saved in localStorage) overrides.
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem('userGuideTheme'); } catch (_) {}
  document.documentElement.setAttribute('data-theme',
    (t === 'light' || t === 'dark') ? t : 'dark');
  applyHljsTheme(resolvedTheme());
})();
</script>
